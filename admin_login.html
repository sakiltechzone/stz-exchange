<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | STZ Exchange</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* --- Admin Dark Theme Variables --- */
        :root {
            --primary-blue: #4e73df;
            --primary-hover: #2e59d9;
            --bg-dark: #0f172a;
            --card-dark: #1e293b;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --border-dark: #334155;
            --accent-gold: #f6c23e;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            background-image: radial-gradient(circle at top right, rgba(78, 115, 223, 0.1), transparent 40%),
                              radial-gradient(circle at bottom left, rgba(246, 194, 62, 0.05), transparent 40%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: var(--text-light);
        }

        .login-container {
            width: 100%;
            max-width: 400px;
            padding: 20px;
        }

        .login-card {
            background: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Top Glowing Line */
        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--primary-blue), var(--accent-gold));
        }

        .admin-logo {
            font-size: 45px;
            color: var(--accent-gold);
            margin-bottom: 10px;
            filter: drop-shadow(0 0 15px rgba(246, 194, 62, 0.4));
        }

        .login-title {
            font-size: 24px;
            font-weight: 700;
            margin: 0 0 5px 0;
            letter-spacing: 1px;
        }

        .login-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-dark);
            border-radius: 10px;
            padding: 5px 15px;
            transition: 0.3s;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(78, 115, 223, 0.2);
        }

        .input-icon {
            color: var(--text-muted);
            font-size: 16px;
            margin-right: 10px;
        }

        .input-wrapper:focus-within .input-icon {
            color: var(--primary-blue);
        }

        .custom-input {
            width: 100%;
            padding: 12px 0;
            background: transparent;
            border: none;
            color: var(--text-light);
            font-size: 14px;
            outline: none;
            font-family: 'Poppins', sans-serif;
        }

        .custom-input::placeholder {
            color: #64748b;
        }

        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
            background: rgba(239, 68, 68, 0.1);
            padding: 10px;
            border-radius: 8px;
            border: 1px solid rgba(239, 68, 68, 0.2);
            text-align: center;
            font-weight: 500;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-blue);
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
        }

        .login-btn:hover {
            background: var(--primary-hover);
            box-shadow: 0 5px 15px rgba(78, 115, 223, 0.4);
            transform: translateY(-2px);
        }

        .login-btn:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .security-badge {
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }

        .security-badge i {
            color: #10b981;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            
            <div class="admin-logo">
                <i class="fas fa-user-shield"></i>
            </div>
            <h2 class="login-title">Admin Portal</h2>
            <p class="login-subtitle">Sign in to manage STZ Exchange</p>

            <div class="error-msg" id="error-message">
                <i class="fas fa-exclamation-circle"></i> <span id="error-text">Invalid credentials.</span>
            </div>

            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                <div class="input-group">
                    <div class="input-wrapper">
                        <div class="input-icon"><i class="fas fa-envelope"></i></div>
                        <input type="email" id="admin-email" class="custom-input" placeholder="Admin Email Address" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <div class="input-icon"><i class="fas fa-lock"></i></div>
                        <input type="password" id="admin-pass" class="custom-input" placeholder="Secure Password" required>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <span>Access Portal</span> <i class="fas fa-sign-in-alt"></i>
                </button>
            </form>

            <div class="security-badge">
                <i class="fas fa-shield-alt"></i> End-to-end Encrypted Connection
            </div>

        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBFevvLD7eqHwSuq4aDavzEQy6qjQCMlUA",
            authDomain: "stz-exchange.firebaseapp.com",
            projectId: "stz-exchange",
            storageBucket: "stz-exchange.firebasestorage.app",
            messagingSenderId: "855972947902",
            appId: "1:855972947902:web:9fc9609346b30d9fdbfbef"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.database();

        // 🌟 MASTER ADMIN EMAIL 🌟
        const MASTER_ADMIN_EMAIL = "sakilmolla210@gmail.com"; 

        // 🌟 SECURE AUTO-LOGIN CHECK 🌟
        auth.onAuthStateChanged(user => {
            if (user && user.email && user.email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase() && localStorage.getItem('stz_admin_login') === 'true') {
                window.location.href = "admin_dashboard.html";
            }
        });

        function handleAdminLogin(e) {
            e.preventDefault();

            const email = document.getElementById('admin-email').value.trim();
            const password = document.getElementById('admin-pass').value.trim();
            const errorBox = document.getElementById('error-message');
            const errorText = document.getElementById('error-text');
            const btn = document.getElementById('login-btn');

            errorBox.style.display = 'none';

            if(email === "" || password === "") {
                errorText.innerText = "Please enter email and password.";
                errorBox.style.display = 'block';
                return;
            }

            // 1. Check Master Admin Email
            if (email.toLowerCase() !== MASTER_ADMIN_EMAIL.toLowerCase()) {
                errorText.innerText = "Access Denied. You are not an admin.";
                errorBox.style.display = 'block';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Authenticating...';

            // 2. Authenticate with Firebase
            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    const loggedInUser = userCredential.user;
                    if (loggedInUser && loggedInUser.email.toLowerCase() === MASTER_ADMIN_EMAIL.toLowerCase()) {
                        localStorage.setItem('stz_admin_login', 'true');
                        window.location.href = "admin_dashboard.html";
                    } else {
                        auth.signOut();
                        localStorage.removeItem('stz_admin_login');
                        btn.disabled = false;
                        btn.innerHTML = '<span>Access Portal</span> <i class="fas fa-sign-in-alt"></i>';
                        errorText.innerText = "Unauthorized access attempt detected.";
                        errorBox.style.display = 'block';
                    }
                })
                .catch((error) => {
                    btn.disabled = false;
                    btn.innerHTML = '<span>Access Portal</span> <i class="fas fa-sign-in-alt"></i>';
                    
                    let friendlyMessage = "Authentication failed. Please try again.";
                    if (error.code === 'auth/invalid-login-credentials' || 
                        error.code === 'auth/wrong-password' || 
                        error.code === 'auth/user-not-found' || 
                        error.code === 'auth/invalid-credential') {
                        friendlyMessage = "Incorrect email or password.";
                    } else if (error.code === 'auth/too-many-requests') {
                        friendlyMessage = "Too many attempts. Try again later.";
                    }

                    errorText.innerText = friendlyMessage;
                    errorBox.style.display = 'block';
                });
        }
    </script>
</body>
</html>
